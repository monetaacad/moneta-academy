# certbot --nginx 를 실행하면 443(HTTPS) 설정이 자동으로 추가됩니다
server {
    listen 80;
    server_name game.example.com;   # 도메인으로 바꾸세요

    client_max_body_size 16k;
    server_tokens off;              # 응답에 nginx 버전을 싣지 않음

    # 두상 업로드 (100×100 JPEG, 브라우저에서 압축해서 보냄)
    location = /api/avatar {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 실시간 채팅 스트림: 버퍼링을 끄고 연결을 오래 유지
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        access_log off;             # 1회용 입장권이 주소에 있으므로 기록하지 않음
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
